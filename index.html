<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Duster AI | V-1.6.5</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap');
        :root { font-family: 'Inter', sans-serif; }
        body { background-color: #0f172a; color: #f1f5f9; overflow-x: hidden; }
        
        .message-user { background-color: #1e293b; border-radius: 18px 18px 0 18px; border: 1px solid #334155; position: relative; }
        .message-duster { background-color: #064e3b; border-radius: 18px 18px 18px 0; border: 1px solid #059669; position: relative; }
        
        .glass-panel {
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(16px);
            border-top: 1px solid rgba(16, 185, 129, 0.2);
        }

        .fab-btn {
            width: 56px; height: 56px; border-radius: 20px; display: flex; align-items: center; justify-content: center;
            background-color: #10B981; color: white; box-shadow: 0 8px 20px rgba(16, 185, 129, 0.3);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }
        .fab-btn:hover { transform: translateY(-5px); background-color: #059669; }

        .lock-overlay {
            position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
            background: rgba(15, 23, 42, 0.85); border-radius: inherit; opacity: 0; transition: opacity 0.3s;
            pointer-events: none; z-index: 10;
        }
        .locked .lock-overlay { opacity: 1; }

        #toast {
            position: fixed; bottom: 120px; left: 50%; transform: translateX(-50%) translateY(20px);
            background: #ef4444; color: white; padding: 12px 24px; border-radius: 12px;
            font-weight: 800; font-size: 14px; text-transform: uppercase; letter-spacing: 1px;
            box-shadow: 0 10px 25px rgba(239, 68, 68, 0.4); z-index: 100;
            pointer-events: none; transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            opacity: 0; visibility: hidden;
        }
        #toast.show { opacity: 1; visibility: visible; transform: translateX(-50%) translateY(0); }
        
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 10px; }

        .modal-backdrop {
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(4px);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col w-full">

    <header class="sticky top-0 z-40 w-full bg-[#0f172a]/95 backdrop-blur-md border-b border-emerald-900/40 p-4">
        <div class="max-w-4xl mx-auto flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 bg-gradient-to-tr from-emerald-600 to-emerald-400 rounded-xl flex items-center justify-center shadow-lg shadow-emerald-500/20">
                    <i data-lucide="zap" class="w-6 h-6 text-white"></i>
                </div>
                <div>
                    <h1 class="text-xl font-black tracking-tighter text-white uppercase leading-none">Duster <span class="text-emerald-400">AI</span></h1>
                    <p class="text-[10px] text-emerald-500 font-mono tracking-widest mt-1 uppercase">V-1.6.5 | ULTRA STABLE</p>
                </div>
            </div>
            
            <div class="flex items-center space-x-2">
                <span class="text-[10px] font-bold text-gray-500 uppercase tracking-widest hidden sm:block">Режим человека</span>
                <label class="toggle-switch">
                    <input type="checkbox" id="human-mode-toggle">
                    <span class="slider" style="position: relative; display: inline-block; width: 44px; height: 24px; cursor: pointer; background-color: #334155; transition: .4s; border-radius: 34px;">
                        <style>
                            .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
                            input:checked + .slider { background-color: #10B981; }
                            input:checked + .slider:before { transform: translateX(20px); }
                        </style>
                    </span>
                </label>
            </div>
        </div>
    </header>

    <main id="chat-container" class="flex-grow p-4 md:p-8 overflow-y-auto">
        <div id="messages" class="w-full max-w-3xl mx-auto space-y-8 pb-44"></div>
    </main>

    <div id="toast">Временное тех обслуживание</div>

    <div class="fixed bottom-28 right-6 z-50 flex flex-col gap-4">
        <button id="storyteller-btn" class="fab-btn bg-emerald-500 shadow-emerald-900/40" title="Сказочник">
            <i data-lucide="sparkles" class="w-7 h-7"></i>
        </button>
        <button id="painter-btn" class="fab-btn shadow-emerald-900/40" title="Художник">
            <i data-lucide="palette" class="w-7 h-7"></i>
            <div class="lock-overlay">
                <i data-lucide="lock" class="w-6 h-6 text-red-400"></i>
            </div>
        </button>
    </div>

    <div class="fixed bottom-0 left-0 w-full p-4 glass-panel z-40">
        <div class="max-w-3xl mx-auto flex items-end space-x-3">
            <div class="flex-grow">
                <textarea id="user-input" rows="1" class="w-full p-4 rounded-2xl bg-slate-900 border border-slate-700 text-white focus:border-emerald-500 outline-none transition-all resize-none shadow-inner" placeholder="Напишите что-нибудь..." oninput="this.style.height = ''; this.style.height = this.scrollHeight + 'px'"></textarea>
            </div>
            <div class="flex space-x-2 pb-1">
                <button id="deep-thinking-btn" class="w-12 h-12 flex items-center justify-center rounded-2xl bg-slate-800 text-emerald-400 border border-slate-700 hover:bg-slate-700 transition-all shadow-lg">
                    <i data-lucide="brain-circuit" class="w-6 h-6"></i>
                </button>
                <button id="ask-duster-btn" class="w-12 h-12 flex items-center justify-center rounded-2xl bg-emerald-600 text-white hover:bg-emerald-500 transition-all shadow-lg">
                    <i data-lucide="send" class="w-6 h-6"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- Модалка сказочника -->
    <div id="storyteller-modal" class="modal-backdrop fixed inset-0 hidden items-center justify-center z-50 p-4">
        <div class="bg-slate-900 w-full max-w-md p-8 rounded-[2.5rem] border border-emerald-500/20 shadow-2xl">
            <h3 class="text-2xl font-black mb-6 flex items-center gap-3 text-white uppercase"><i data-lucide="sparkles" class="text-emerald-400"></i> Сказочник</h3>
            <textarea id="story-topic-input" rows="3" class="w-full p-5 rounded-2xl bg-slate-800 border border-slate-700 text-white mb-6 outline-none focus:border-emerald-500" placeholder="О чем будет сказка?"></textarea>
            <div class="flex gap-3">
                <button onclick="toggleModal('storyteller-modal')" class="flex-1 py-4 bg-slate-800 rounded-2xl font-bold text-white hover:bg-slate-700 transition-all">ОТМЕНА</button>
                <button id="generate-story-btn" class="flex-[2] py-4 bg-emerald-600 rounded-2xl font-black tracking-widest text-white hover:bg-emerald-500 transition-all">СОЧИНИТЬ</button>
            </div>
        </div>
    </div>

    <script type="module">
        lucide.createIcons();

        // Настройки Gemini
        const apiKey = ""; // Ключ подставится автоматически
        const MODEL_URL = "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent";
        
        let isHumanMode = false;

        window.toggleModal = (id) => {
            const m = document.getElementById(id);
            if(m) {
                m.classList.toggle('hidden');
                m.classList.toggle('flex');
            }
        };

        function displayMessage(role, text) {
            const container = document.getElementById('messages');
            const wrap = document.createElement('div');
            wrap.className = `flex w-full ${role === 'user' ? 'justify-end' : 'justify-start'} animate-in fade-in slide-in-from-bottom-4 duration-500`;
            
            const box = document.createElement('div');
            box.className = `max-w-[85%] p-5 ${role === 'user' ? 'message-user' : 'message-duster'}`;
            
            if (role !== 'user') {
                box.innerHTML = `<div class="flex items-center space-x-2 mb-2"><div class="w-2 h-2 bg-emerald-400 rounded-full"></div><span class="text-[10px] font-black text-emerald-400/80 uppercase tracking-widest">Duster AI</span></div>`;
            }

            const content = document.createElement('div');
            content.className = 'text-sm md:text-base leading-relaxed whitespace-pre-wrap font-medium';
            content.textContent = text;
            box.appendChild(content);
            
            wrap.appendChild(box);
            container.appendChild(wrap);
            const chatContainer = document.getElementById('chat-container');
            chatContainer.scrollTo({ top: chatContainer.scrollHeight, behavior: 'smooth' });
            return box;
        }

        async function askDuster(prompt, customSystem = null) {
            const loader = displayMessage('duster', "Думаю...");
            const statusLabel = loader.querySelector('div:last-child');

            try {
                const systemPrompt = customSystem || (isHumanMode 
                    ? "Ты Дастер. Дерзкий пацан, свой в доску. Твой стиль — сленг, краткость, общение строго на 'ТЫ'. Отвечай четко, но с пацанским характером." 
                    : "Ты Duster AI, профессиональный и умный ассистент.");

                const response = await fetch(`${MODEL_URL}?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: prompt }] }],
                        systemInstruction: { parts: [{ text: systemPrompt }] }
                    })
                });

                if (!response.ok) throw new Error("Сбой API");

                const data = await response.json();
                const resultText = data.candidates?.[0]?.content?.parts?.[0]?.text || "Пустой ответ.";
                statusLabel.textContent = resultText;

            } catch (err) { 
                statusLabel.innerHTML = `<span class="text-red-400 font-bold">Ошибка:</span> Не удалось связаться с сервером. Проверь соединение.`;
                console.error(err);
            }
        }

        // Обработчики кнопок
        document.getElementById('painter-btn').onclick = function() {
            const toast = document.getElementById('toast');
            this.classList.add('locked');
            toast.classList.add('show');
            setTimeout(() => { this.classList.remove('locked'); toast.classList.remove('show'); }, 3000);
        };

        document.getElementById('human-mode-toggle').onchange = (e) => isHumanMode = e.target.checked;
        
        const sendMessage = () => {
            const input = document.getElementById('user-input');
            const val = input.value.trim();
            if (val) { 
                displayMessage('user', val); 
                askDuster(val); 
                input.value = ''; 
                input.style.height = ''; 
            }
        };

        document.getElementById('ask-duster-btn').onclick = sendMessage;
        document.getElementById('user-input').onkeydown = (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        };

        document.getElementById('deep-thinking-btn').onclick = () => {
            const input = document.getElementById('user-input');
            const val = input.value.trim();
            if (val) { 
                displayMessage('user', `[АНАЛИЗ] ${val}`); 
                askDuster(val, "Выполни глубокий, экспертный анализ вопроса пользователя. Разложи всё по полочкам."); 
                input.value = ''; 
                input.style.height = ''; 
            }
        };

        document.getElementById('storyteller-btn').onclick = () => toggleModal('storyteller-modal');
        document.getElementById('generate-story-btn').onclick = () => {
            const t = document.getElementById('story-topic-input').value.trim();
            if (t) { 
                toggleModal('storyteller-modal'); 
                displayMessage('user', `Придумай сказку про ${t}`); 
                askDuster(`Напиши длинную и интересную сказку на тему: ${t}`, "Ты профессиональный сказочник. Пиши захватывающе и красиво."); 
                document.getElementById('story-topic-input').value = ''; 
            }
        };

        window.onload = () => {
            displayMessage('duster', "Добрый день");
            document.getElementById('user-input').focus();
        };
    </script>
</body>
</html>
