<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Duster AI | V-1.4.1</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap');
        :root { font-family: 'Inter', sans-serif; }
        body { background-color: #0f172a; color: #f1f5f9; overflow-x: hidden; }
        
        .message-user { background-color: #1e293b; border-radius: 18px 18px 0 18px; border: 1px solid #334155; position: relative; }
        .message-duster { background-color: #064e3b; border-radius: 18px 18px 18px 0; border: 1px solid #059669; position: relative; }
        
        .glass-panel {
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(16px);
            border-top: 1px solid rgba(16, 185, 129, 0.2);
        }

        .fab-btn {
            width: 56px; height: 56px; border-radius: 20px; display: flex; align-items: center; justify-content: center;
            background-color: #10B981; color: white; box-shadow: 0 8px 20px rgba(16, 185, 129, 0.3);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .fab-btn:hover { transform: translateY(-5px); background-color: #059669; }

        .copy-btn {
            position: absolute; top: 8px; right: 8px; padding: 6px;
            background: rgba(0,0,0,0.2); border-radius: 8px; opacity: 0.4;
            transition: all 0.2s; color: white; cursor: pointer;
        }
        .copy-btn:hover { opacity: 1; background: rgba(0,0,0,0.4); }

        .toggle-switch { position: relative; display: inline-block; width: 44px; height: 24px; }
        .toggle-switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
            background-color: #334155; transition: .4s; border-radius: 34px;
        }
        .slider:before {
            position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px;
            background-color: white; transition: .4s; border-radius: 50%;
        }
        input:checked + .slider { background-color: #10B981; }
        input:checked + .slider:before { transform: translateX(20px); }

        .generated-image { width: 100%; border-radius: 16px; margin-top: 12px; border: 2px solid #10B981; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .modal-backdrop { background-color: rgba(0, 0, 0, 0.9); backdrop-filter: blur(12px); }
        
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 10px; }
    </style>
</head>
<body class="min-h-screen flex flex-col w-full">

    <!-- Header -->
    <header class="sticky top-0 z-40 w-full bg-[#0f172a]/95 backdrop-blur-md border-b border-emerald-900/40 p-4">
        <div class="max-w-4xl mx-auto flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 bg-gradient-to-tr from-emerald-600 to-emerald-400 rounded-xl flex items-center justify-center shadow-lg shadow-emerald-500/20">
                    <i data-lucide="zap" class="w-6 h-6 text-white"></i>
                </div>
                <div>
                    <h1 class="text-xl font-black tracking-tighter text-white uppercase leading-none">Duster <span class="text-emerald-400">AI</span></h1>
                    <p class="text-[10px] text-emerald-500 font-mono tracking-widest mt-1">V-1.4.1 | API READY</p>
                </div>
            </div>
            
            <div class="flex items-center space-x-5">
                <div class="flex items-center space-x-2">
                    <span class="text-[10px] font-bold text-gray-500 uppercase tracking-widest hidden sm:block">Режим человека</span>
                    <label class="toggle-switch">
                        <input type="checkbox" id="human-mode-toggle">
                        <span class="slider"></span>
                    </label>
                </div>
            </div>
        </div>
    </header>

    <!-- Chat Area -->
    <main id="chat-container" class="flex-grow p-4 md:p-8 overflow-y-auto">
        <div id="messages" class="w-full max-w-3xl mx-auto space-y-8 pb-44"></div>
    </main>

    <!-- Side Actions -->
    <div class="fixed bottom-28 right-6 z-50 flex flex-col gap-4">
        <button id="storyteller-btn" class="fab-btn bg-emerald-500 shadow-emerald-900/40" title="Сказочник">
            <i data-lucide="sparkles" class="w-7 h-7"></i>
        </button>
        <button id="painter-btn" class="fab-btn shadow-emerald-900/40" title="Художник">
            <i data-lucide="palette" class="w-7 h-7"></i>
        </button>
    </div>

    <!-- Input Box -->
    <div class="fixed bottom-0 left-0 w-full p-4 glass-panel z-40">
        <div class="max-w-3xl mx-auto flex items-end space-x-3">
            <div class="flex-grow">
                <textarea id="user-input" rows="1" class="w-full p-4 rounded-2xl bg-slate-900 border border-slate-700 text-white focus:border-emerald-500 outline-none transition-all resize-none shadow-inner" placeholder="Спросите вашего ассистента..." oninput="this.style.height = ''; this.style.height = this.scrollHeight + 'px'"></textarea>
            </div>
            <div class="flex space-x-2 pb-1">
                <button id="deep-thinking-btn" class="w-12 h-12 flex items-center justify-center rounded-2xl bg-slate-800 text-emerald-400 border border-slate-700 hover:bg-slate-700 transition-all shadow-lg">
                    <i data-lucide="brain-circuit" class="w-6 h-6"></i>
                </button>
                <button id="ask-duster-btn" class="w-12 h-12 flex items-center justify-center rounded-2xl bg-emerald-600 text-white hover:bg-emerald-500 transition-all shadow-lg">
                    <i data-lucide="send" class="w-6 h-6"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- Modals -->
    <div id="painter-modal" class="modal-backdrop fixed inset-0 hidden items-center justify-center z-50 p-4">
        <div class="bg-slate-900 w-full max-w-md p-8 rounded-[2.5rem] border border-emerald-500/20 shadow-2xl">
            <h3 class="text-2xl font-black mb-6 flex items-center gap-3"><i data-lucide="palette" class="text-emerald-400"></i> ХУДОЖНИК</h3>
            <textarea id="image-prompt-input" rows="4" class="w-full p-5 rounded-2xl bg-slate-800 border border-slate-700 text-white mb-6 outline-none focus:border-emerald-500" placeholder="Опишите картину..."></textarea>
            <div class="flex gap-3">
                <button onclick="toggleModal('painter-modal')" class="flex-1 py-4 bg-slate-800 rounded-2xl font-bold">ОТМЕНА</button>
                <button id="generate-image-btn" class="flex-[2] py-4 bg-emerald-600 rounded-2xl font-black tracking-widest">РИСОВАТЬ</button>
            </div>
        </div>
    </div>

    <div id="storyteller-modal" class="modal-backdrop fixed inset-0 hidden items-center justify-center z-50 p-4">
        <div class="bg-slate-900 w-full max-w-md p-8 rounded-[2.5rem] border border-emerald-500/20 shadow-2xl">
            <h3 class="text-2xl font-black mb-6 flex items-center gap-3"><i data-lucide="sparkles" class="text-emerald-400"></i> СКАЗОЧНИК</h3>
            <textarea id="story-topic-input" rows="3" class="w-full p-5 rounded-2xl bg-slate-800 border border-slate-700 text-white mb-6 outline-none focus:border-emerald-500" placeholder="О чем будет сказка?"></textarea>
            <div class="flex gap-3">
                <button onclick="toggleModal('storyteller-modal')" class="flex-1 py-4 bg-slate-800 rounded-2xl font-bold">ОТМЕНА</button>
                <button id="generate-story-btn" class="flex-[2] py-4 bg-emerald-600 rounded-2xl font-black tracking-widest">СОЧИНИТЬ</button>
            </div>
        </div>
    </div>

    <script type="module">
        lucide.createIcons();

        const GEMINI_KEY = "AIzaSyDWsxWYN102YQXtvpsTlkF_kfW08fwx99k";
        const MODEL = "gemini-2.5-flash-preview-09-2025";
        
        let isHumanMode = false;

        window.toggleModal = (id) => {
            const m = document.getElementById(id);
            if(m) {
                m.classList.toggle('hidden');
                m.classList.toggle('flex');
            }
        };

        async function copyToClipboard(text, btn) {
            const textArea = document.createElement("textarea");
            textArea.value = text;
            document.body.appendChild(textArea);
            textArea.select();
            try {
                document.execCommand('copy');
                const icon = btn.querySelector('i');
                const originalName = icon.getAttribute('data-lucide');
                btn.innerHTML = '<i data-lucide="check" class="w-4 h-4 text-emerald-400"></i>';
                lucide.createIcons();
                setTimeout(() => {
                    btn.innerHTML = `<i data-lucide="${originalName}" class="w-4 h-4"></i>`;
                    lucide.createIcons();
                }, 2000);
            } catch (err) { console.error("Copy failed"); }
            document.body.removeChild(textArea);
        }

        function displayMessage(role, text, isImage = false) {
            const container = document.getElementById('messages');
            const wrap = document.createElement('div');
            wrap.className = `flex w-full ${role === 'user' ? 'justify-end' : 'justify-start'} animate-in fade-in slide-in-from-bottom-4 duration-500`;
            
            const box = document.createElement('div');
            box.className = `max-w-[85%] p-5 ${role === 'user' ? 'message-user' : 'message-duster'}`;
            
            if (role !== 'user') {
                box.innerHTML += `<div class="flex items-center space-x-2 mb-2"><div class="w-2 h-2 bg-emerald-400 rounded-full"></div><span class="text-[10px] font-black text-emerald-400/80 uppercase tracking-widest">Duster AI</span></div>`;
                
                if (!isImage) {
                    const copyBtn = document.createElement('button');
                    copyBtn.className = 'copy-btn';
                    copyBtn.innerHTML = '<i data-lucide="copy" class="w-4 h-4"></i>';
                    copyBtn.onclick = () => copyToClipboard(text, copyBtn);
                    box.appendChild(copyBtn);
                    setTimeout(() => lucide.createIcons(), 0);
                }
            }

            if (isImage) {
                const img = document.createElement('img');
                img.src = text;
                img.className = 'generated-image shadow-2xl';
                box.appendChild(img);
            } else {
                const content = document.createElement('div');
                content.className = 'text-sm md:text-base leading-relaxed whitespace-pre-wrap font-medium pr-6';
                content.textContent = text;
                box.appendChild(content);
            }
            
            wrap.appendChild(box);
            container.appendChild(wrap);
            document.getElementById('chat-container').scrollTo({ top: container.scrollHeight, behavior: 'smooth' });
            return box;
        }

        async function askGemini(prompt, isDeep = false, customSystem = null) {
            const loader = displayMessage('duster', "...");
            try {
                let systemPrompt = customSystem || (isHumanMode ? 
                    "Ты Дастер, дерзкий свой пацан. Общайся на ТЫ, используй сленг. Если пользователь просит что-то творческое (сказку, анализ, длинную историю), отвечай максимально развернуто, детально и атмосферно." : 
                    "Ты Duster AI, профессиональный и полезный ассистент. Если вопрос требует подробностей, структуры или творчества, пиши глубокие и развернутые ответы.");
                
                if(isDeep && !customSystem) systemPrompt += " Режим Deep Mind: проанализируй все детали и дай исчерпывающий ответ.";

                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent?key=${GEMINI_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: prompt }] }],
                        systemInstruction: { parts: [{ text: systemPrompt }] }
                    })
                });
                const data = await response.json();
                const resultText = data.candidates?.[0]?.content?.parts?.[0]?.text;
                
                if (resultText) {
                    const contentDiv = loader.querySelector('div:last-child');
                    contentDiv.textContent = resultText;
                    const cBtn = loader.querySelector('.copy-btn');
                    if(cBtn) cBtn.onclick = () => copyToClipboard(resultText, cBtn);
                } else { loader.querySelector('div:last-child').textContent = "Запрос отклонен ИИ."; }
            } catch (err) { loader.querySelector('div:last-child').textContent = "Ошибка ядра Gemini."; }
        }

        async function generateVisual(userPrompt) {
            displayMessage('user', `Нарисуй: ${userPrompt}`);
            const loader = displayMessage('duster', "Готовлю холст...");
            try {
                const transRes = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent?key=${GEMINI_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: `Generate a high-quality English artistic prompt for: "${userPrompt}". Focus on colors and lighting. Return ONLY the prompt.` }] }]
                    })
                });
                const transData = await transRes.json();
                const engPrompt = transData.candidates?.[0]?.content?.parts?.[0]?.text?.trim() || userPrompt;
                const imageUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(engPrompt)}?width=1024&height=1024&nologo=true&seed=${Math.floor(Math.random() * 999999)}`;
                
                loader.innerHTML = `
                    <div class="flex items-center space-x-2 mb-2"><div class="w-2 h-2 bg-emerald-400 rounded-full"></div><span class="text-[10px] font-black text-emerald-400/80 uppercase tracking-widest">Duster Art</span></div>
                    <img src="${imageUrl}" class="generated-image" alt="Generated Art">
                `;
            } catch (err) { loader.lastChild.textContent = "Ошибка генерации изображения."; }
        }

        document.getElementById('human-mode-toggle').onchange = (e) => isHumanMode = e.target.checked;
        document.getElementById('ask-duster-btn').onclick = () => {
            const input = document.getElementById('user-input');
            const val = input.value.trim();
            if (!val) return;
            displayMessage('user', val);
            askGemini(val);
            input.value = ''; input.style.height = '';
        };
        document.getElementById('deep-thinking-btn').onclick = () => {
            const input = document.getElementById('user-input');
            const val = input.value.trim();
            if (!val) return;
            displayMessage('user', `[DEEP ANALYSIS] ${val}`);
            askGemini(val, true);
            input.value = ''; input.style.height = '';
        };
        document.getElementById('painter-btn').onclick = () => toggleModal('painter-modal');
        document.getElementById('storyteller-btn').onclick = () => toggleModal('storyteller-modal');
        document.getElementById('generate-image-btn').onclick = () => {
            const p = document.getElementById('image-prompt-input').value.trim();
            if (p) { toggleModal('painter-modal'); generateVisual(p); document.getElementById('image-prompt-input').value = ''; }
        };
        document.getElementById('generate-story-btn').onclick = () => {
            const t = document.getElementById('story-topic-input').value.trim();
            if (t) {
                toggleModal('storyteller-modal');
                displayMessage('user', `Расскажи сказку: ${t}`);
                askGemini(`Напиши длинную и очень развернутую сказку на тему: "${t}"`, false, "Ты лучший в мире автор сказок. Твои истории должны быть объемными, живыми и невероятно подробными.");
                document.getElementById('story-topic-input').value = '';
            }
        };

        window.onload = () => displayMessage('duster', "Ваш лучший ассистент готов к работе");
    </script>
</body>
</html>
